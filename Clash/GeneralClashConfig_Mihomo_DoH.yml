# Mihomo 订阅转换基础模板，配合 ACL4SSR_Online_Full_NoAuto.ini 使用。
mixed-port: 7890
socks-port: 7891
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
  prefer-h3: false
  respect-rules: false

  # IP 地址形式的加密上游负责 DNS 服务域名的引导解析。
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  # 节点域名独立解析，代理建立前即可使用。
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'

  # 域名已判定走直连时，使用国内 DoH 获取适合本地网络的结果。
  direct-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://223.6.6.6/dns-query#DIRECT'
  direct-nameserver-follow-policy: false

  # 普通查询（包括未知域名的 IP 分流查询）经指定节点发送。
  # 在客户端为“🔒 DNS代理”选择一个可用节点。
  nameserver:
    - 'https://1.1.1.1/dns-query#🔒 DNS代理'
    - 'https://8.8.8.8/dns-query#🔒 DNS代理'
